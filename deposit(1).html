{% extends "base.html" %}
{% block content %}
<h1>Deposit KES</h1>
<div class="card">
<p>M-PESA STK will request payment from the phone number you enter.</p>
<p>Your wallet is credited only after a verified provider callback/reconciliation.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>M-PESA phone number<input name="phone" placeholder="2547XXXXXXXX" required></label>
<label>Amount (KES)<input type="number" name="amount" min="10" step="1" required></label>
<button class="button">Send M-PESA prompt</button>
</form>
</div>
{% endblock %}
