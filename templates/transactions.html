{% extends "base.html" %}
{% block content %}
<h1>Transaction history</h1>
<div class="card">
<table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th><th>Reference</th></tr>
{% for t in transactions %}
<tr><td>{{ t.created_at.strftime("%Y-%m-%d %H:%M") }}</td><td>{{ t.tx_type }}</td><td>{{ "%.2f"|format(t.amount) }} {{ t.currency }}</td><td>{{ t.status }}</td><td>{{ t.reference }}</td></tr>
{% endfor %}
</table>
</div>
{% endblock %}
