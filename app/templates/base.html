<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Real Investment Platform{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        nav {
            background: #102a43;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
        }

        .btn {
            display: inline-block;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            background: #1677ff;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-danger {
            background: #dc3545;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            margin-bottom: 15px;
            border: 1px solid #ccd3dc;
            border-radius: 7px;
            font-size: 15px;
        }

        label {
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .success {
            color: #16803c;
        }

        .warning {
            color: #a66b00;
        }

        .danger {
            color: #c62828;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<nav>

    <div class="logo">
        Real Investment Platform
    </div>

    <div>
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/deposit">Deposit</a>
        <a href="/transactions">Transactions</a>
        <a href="/invest">Invest</a>
        <a href="/logout">Logout</a>
    </div>

</nav>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

<footer>
    © 2026 Real Investment Platform
</footer>

</body>
</html>
