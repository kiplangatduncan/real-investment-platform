{% extends "base.html" %}

{% block title %}
Deposit Funds
{% endblock %}

{% block content %}

<div class="card"
     style="max-width:500px;margin:auto;">

    <h2>Deposit Funds</h2>

    <p>
        Enter the amount you want to deposit
        and your M-PESA phone number.
    </p>

    <form id="depositForm">

        <label for="amount">
            Amount (KSh)
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            min="10"
            step="1"
            placeholder="Enter amount"
            required
        >

        <label for="phone">
            M-PESA Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="07XXXXXXXX"
            autocomplete="tel"
            required
        >

        <button
            class="btn"
            id="depositButton"
            type="submit">

            Deposit with M-PESA

        </button>

    </form>

    <div
        id="message"
        style="margin-top:20px;">
    </div>

</div>


<script>

const depositForm =
    document.getElementById(
        "depositForm"
    );

const amountInput =
    document.getElementById(
        "amount"
    );

const phoneInput =
    document.getElementById(
        "phone"
    );

const depositButton =
    document.getElementById(
        "depositButton"
    );

const message =
    document.getElementById(
        "message"
    );


depositForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const amount =
            amountInput.value.trim();

        const phone =
            phoneInput.value.trim();


        if (!amount || !phone) {

            message.innerHTML =
                "<span class='danger'>" +
                "Please enter the amount and " +
                "M-PESA phone number." +
                "</span>";

            return;
        }


        depositButton.disabled = true;

        depositButton.innerText =
            "Sending request...";


        message.innerHTML =
            "Sending M-PESA payment request...";


        try {

            const response =
                await fetch(
                    "/deposit",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            amount: amount,
                            phone: phone
                        })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                message.innerHTML =
                    "<span class='success'>" +
                    "M-PESA request sent successfully. " +
                    "Check your phone and enter your M-PESA PIN. " +
                    "Your balance will only be updated after " +
                    "the payment is confirmed." +
                    "</span>";

            } else {

                message.innerHTML =
                    "<span class='danger'>" +
                    (
                        data.message ||
                        "Payment request failed."
                    ) +
                    "</span>";

            }


        } catch (error) {

            console.error(error);

            message.innerHTML =
                "<span class='danger'>" +
                "Unable to connect to the payment server. " +
                "Please try again." +
                "</span>";

        } finally {

            depositButton.disabled = false;

            depositButton.innerText =
                "Deposit with M-PESA";

        }

    }
);

</script>

{% endblock %}
