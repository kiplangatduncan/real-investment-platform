{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="card"
     style="max-width:450px;margin:auto;">

    <h2>Login to Your Account</h2>

    <form method="POST"
          action="/login">

        <label>Email or Phone</label>

        <input
            type="text"
            name="email"
            placeholder="Email or phone"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button class="btn"
                type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">Create account</a>
    </p>

</div>

{% endblock %}
