<!DOCTYPE html>
<html>
<head>
    <title>Deposit Funds</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        input,
        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Deposit Funds</h2>

    <p>Enter the amount you want to deposit.</p>

    <form id="depositForm">

        <label>Amount (KSh)</label>

        <input
            type="number"
            id="amount"
            min="10"
            required
            placeholder="Enter amount"
        >

        <label>M-PESA Phone Number</label>

        <input
            type="tel"
            id="phone"
            required
            placeholder="07XXXXXXXX"
        >

        <button type="submit">
            Deposit with M-PESA
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

document.getElementById("depositForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const amount =
        document.getElementById("amount").value;

    const phone =
        document.getElementById("phone").value;

    const message =
        document.getElementById("message");

    message.innerHTML =
        "Sending M-PESA payment request...";

    try {

        const response = await fetch(
            "/payments/deposit",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    amount: amount,
                    phone: phone
                })
            }
        );

        const result = await response.json();

        if (result.success) {

            message.innerHTML =
                "Check your phone and enter your M-PESA PIN.";

        } else {

            message.innerHTML =
                result.message ||
                "Payment request failed.";

        }

    } catch (error) {

        message.innerHTML =
            "Something went wrong. Please try again.";

    }

});

</script>

</body>
</html>
